name: ATMOS build

# Builds the dual-core firmware from the nightly branch and keeps the .fwsc as an Actions artifact.
# It skips the host tests and the gh-pages publishing of nightly.yml.
#
# v2: it writes a report on the SUMMARY page of the run (errors and the last lines of each build log); and if the
# build with the audio resident in SRAM fails, it builds again with the audio in flash.
on:
  push:
    branches: [nightly]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      JIELI_TOOLCHAIN: ${{ github.workspace }}/.nightly-deps/jieli/toolchain
      AC79_SDK: ${{ github.workspace }}/.nightly-deps/sdk
      PARALLEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
          python -m pip install Pillow fonttools

      - uses: actions/cache@v4
        with:
          path: .nightly-deps
          key: jieli-linux-sdk-d179b448-v1

      - name: Fetch pinned SDK and toolchain
        run: |
          if [ ! -x "$JIELI_TOOLCHAIN/pi32v2/bin/clang" ]; then
            tools/get_toolchain.sh "$GITHUB_WORKSPACE/.nightly-deps/jieli"
          fi
          if [ ! -d "$AC79_SDK/.git" ]; then
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK"
          fi
          test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047

      - name: Build dual core with the audio in SRAM
        id: ram
        continue-on-error: true
        env:
          MELODEE_DUAL_CORE: '1'
          MELODEE_RAM_AUDIO: '1'
        run: |
          set -o pipefail
          ./build.sh --nightly 2>&1 | tee build-ram.log

      - name: Keep that build
        if: steps.ram.outcome == 'success'
        run: |
          mkdir -p out/ram
          cp build/*.fwsc out/ram/

      - name: Build dual core with the audio in flash, only if the first build failed
        id: flash
        if: steps.ram.outcome != 'success'
        continue-on-error: true
        env:
          MELODEE_DUAL_CORE: '1'
        run: |
          set -o pipefail
          ./build.sh --nightly 2>&1 | tee build-flash.log

      - name: Keep that build
        if: steps.flash.outcome == 'success'
        run: |
          mkdir -p out/flash
          cp build/*.fwsc out/flash/

      - name: Report on the summary page
        if: always()
        run: |
          {
            echo '## ATMOS build report'
            echo
            echo "- audio resident in SRAM: **${{ steps.ram.outcome }}**"
            echo "- audio in flash: **${{ steps.flash.outcome }}**"
            for f in build-ram.log build-flash.log; do
              if [ -f "$f" ]; then
                echo
                echo "### $f: lines that mention a problem, then the last lines"
                echo '~~~'
                grep -n -i -E "error|undefined|headroom|overflow|overlaps|calls XIP|must remain|escaped|budget|Unsupported|Traceback" "$f" | head -40 || true
                echo '...'
                tail -25 "$f"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atmos-build-${{ github.run_number }}
          path: |
            out/**
            build-*.log
          if-no-files-found: warn

      - name: Fail when no firmware was built
        if: steps.ram.outcome != 'success' && steps.flash.outcome != 'success'
        run: exit 1
