
name: Build VintageS firmware

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "build.sh"
      - "tools/**"
      - "firmware/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv \
            libfribidi-dev libharfbuzz-dev \
            libfreetype6-dev git curl xz-utils

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user --break-system-packages Pillow fonttools

      - name: Install JieLi toolchain
        run: |
          chmod +x tools/get_toolchain.sh
          tools/get_toolchain.sh "$HOME/.jieli"

      - name: Install AC79 SDK
        run: |
          git clone --depth 1 \
            --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git \
            "$HOME/fw-AC79_AIoT_SDK"

      - name: Build firmware
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload FWSC
        uses: actions/upload-artifact@v4
        with:
          name: VintageS-firmware
          path: build/melodee.fwsc
          if-no-files-found: error
          retention-days: 14

